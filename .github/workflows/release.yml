name: Release

# Push a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`) to publish a GitHub release
# with the single-file rightwrite.html attached.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/rightwrite.html --title "rightwrite $GITHUB_REF_NAME" --generate-notes
